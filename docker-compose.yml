version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: votesystem-app
    restart: unless-stopped

    ports:
      - "${APP_PORT}:80"

    depends_on:
      - mysql

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./:/var/www/html

    networks:
      - votesystem-network

  mysql:
    image: mariadb:10.11
    container_name: votesystem-db
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/votesystem.sql:/docker-entrypoint-initdb.d/01-votesystem.sql:ro

    networks:
      - votesystem-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: votesystem-phpmyadmin
    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    networks:
      - votesystem-network

volumes:
  mysql_data:

networks:
  votesystem-network:
    driver: bridge
