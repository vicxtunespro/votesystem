services:
  app:
    build: .
    container_name: votesystem-app
    restart: unless-stopped

    ports:
      - "${APP_PORT}:80"

    depends_on:
      - mysql

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./:/var/www/html

  mysql:
    image: mysql:8.4
    container_name: votesystem-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/votesystem.sql:/docker-entrypoint-initdb.d/votesystem.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: votesystem-phpmyadmin
    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      
volumes:
  mysql_data: